<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>기획듀스 101</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23121110'/%3E%3Ccircle cx='32' cy='34' r='16' fill='%23F5C542'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
/* layout: one phone-width column, sticky top bar, fixed bottom tabs; thumbnails are SVG so they scale like a real home feed */
:root{
  --bg:#121110; --surface:#1B1917; --surface-2:#262320; --line:#38322A; --fg:#F3EEE5; --muted:#A39B8E;
  --accent:#F5C542; --accent-fg:#1C1300; --accent-text:#F5C542; --good:#62C48E; --warn:#E8A14F; --bad:#E36A6A;
  --thumb-bg:#0E0D0C;
  --font-body:'IBM Plex Sans KR',system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-display:'Black Han Sans','IBM Plex Sans KR',system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#F6F2EA; --surface:#FFFFFF; --surface-2:#EEE8DC; --line:#DCD3C3; --fg:#1C1813; --muted:#6E6657;
  --accent:#F0BC2E; --accent-fg:#1C1300; --accent-text:#8B6300; --good:#1E8A52; --warn:#B86A14; --bad:#C23B3B;
  color-scheme:light;
} }
:root[data-theme="light"]{
  --bg:#F6F2EA; --surface:#FFFFFF; --surface-2:#EEE8DC; --line:#DCD3C3; --fg:#1C1813; --muted:#6E6657;
  --accent:#F0BC2E; --accent-fg:#1C1300; --accent-text:#8B6300; --good:#1E8A52; --warn:#B86A14; --bad:#C23B3B;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:600px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{font-family:var(--font-display);font-size:22px;letter-spacing:.5px;color:var(--fg);line-height:1}
.brand b{color:var(--accent)}
.week{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.gbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#1f1f1f;border:1px solid #dadce0;border-radius:10px;padding:10px 16px;font-weight:500;font-size:14px;cursor:pointer}
.gbtn svg{width:18px;height:18px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:500;line-height:1.5;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.pill.warn{border-color:var(--warn);color:var(--warn)}
.pill.bad{border-color:var(--bad);color:var(--bad)}
.pill.good{border-color:var(--good);color:var(--good)}
.pill.acc{border-color:var(--accent-text);color:var(--accent-text)}
.pill.eye{border-style:dashed;color:var(--muted)}
.pill.eye b{font-weight:500;color:var(--fg)}
.pill.eye::before{content:"\1F512";font-size:10px}

main{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(84px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:700;line-height:1.3}
h2{font-size:18px}
h3{font-size:15px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.note{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted)}
.note.acc{border-left:3px solid var(--accent);border-radius:0 10px 10px 0;color:var(--fg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:9px 14px;font-weight:500;font-size:14px;min-height:40px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:5px 10px;min-height:30px;font-size:12.5px;border-radius:8px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:600px;margin:0 auto;display:flex}
.tab{flex:1;border:0;background:transparent;color:var(--muted);padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;min-width:0}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent-text)}
.tab .dot{position:absolute}

.feed{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:520px){.feed{grid-template-columns:1fr 1fr;gap:16px}}
.tile{display:block;text-align:left;background:transparent;border:0;padding:0;color:inherit;width:100%;min-width:0}
.thumb{width:100%;max-width:100%;aspect-ratio:16/9;display:block;border-radius:10px;background:var(--thumb-bg);overflow:hidden}
.thumb text{font-family:var(--font-display);paint-order:stroke;stroke:#000;stroke-width:4;stroke-linejoin:round}
.thumb .t1{fill:#FFFFFF}
.thumb .t2{fill:#FFD24A}
.tile-title{margin-top:8px;font-weight:500;font-size:14.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile-meta{margin-top:3px;font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tile.picked .thumb{outline:3px solid var(--accent);outline-offset:-3px}
.tabs-in .tab{font-size:10.5px}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;font-weight:500;color:var(--muted)}
.field label b{color:var(--accent-text);font-weight:700}
.field input,.field textarea,.field select{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14.5px;color:var(--fg);min-width:0}
.field textarea{min-height:76px;resize:vertical}
.field .hint{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.field .hint.bad{color:var(--bad)}
.field .hint.warn{color:var(--warn)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;font-size:13px;color:var(--muted);min-width:0}
.seg button.on{background:var(--accent);color:var(--accent-fg);font-weight:500}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--accent)}

.match{display:flex;flex-direction:column;gap:10px}
.desktop-word{display:none}
@media (min-width:700px){
  .match{display:grid;grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr);align-items:stretch}
  .match .vs{align-self:center}
  .mobile-word{display:none}
  .desktop-word{display:inline}
}
.vs{text-align:center;font-family:var(--font-display);font-size:18px;color:var(--muted);letter-spacing:1px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0}
.mcard .ttl{margin-top:8px;font-weight:500;font-size:15px;line-height:1.4}
.mcard .one{margin-top:3px;font-size:13.5px;color:var(--fg)}
.mcard .one{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.mcard .hook{margin-top:6px;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px;display:flex;flex-direction:column;gap:3px}
.mcard .hook b{color:var(--accent-text);font-weight:500}
.sec{display:flex;flex-direction:column;gap:10px;padding-top:10px;border-top:1px solid var(--line)}
.sec h3{font-size:14px}
.setrow{display:grid;grid-template-columns:38px 1fr 1fr 44px;gap:6px;align-items:center}
.setrow.one{grid-template-columns:38px 1fr}
.setrow input{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14.5px;color:var(--fg);min-width:0}
.setlab{font-size:12px;color:var(--muted);font-weight:500}
.setlab b{color:var(--accent-text)}
.alts{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-size:13px}
.alt{display:grid;grid-template-columns:76px 1fr;gap:8px;min-width:0}
.alt span:last-child{word-break:break-word}
.lnk{color:var(--accent-text);word-break:break-all}
.thumb-img{width:100%;max-width:100%;aspect-ratio:16/9;object-fit:cover;display:block;border-radius:10px;background:#0E0D0C}
.brow{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;width:100%;color:inherit;min-width:0;cursor:pointer}
.brow .bt{flex:1;min-width:0}
.brow .bt .ttl{font-weight:500;font-size:15px;line-height:1.35}
.brow .bt .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.drop{display:block;border:1px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--muted);font-size:13px;background:var(--surface-2);cursor:pointer}
.drop input{display:none}
.notebox{margin-top:8px;font-size:13px;background:var(--surface-2);border-radius:10px;padding:8px 10px;white-space:pre-wrap;word-break:break-word}
.notebox b{color:var(--accent-text);font-weight:500}
details.more{margin-top:8px}
details.more summary{cursor:pointer;color:var(--accent-text);font-size:13px;font-weight:500;list-style:none;display:flex;align-items:center;gap:4px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"▸";font-size:11px}
details.more[open] summary::before{content:"▾"}
.kv{display:grid;grid-template-columns:72px 1fr;gap:4px 10px;font-size:13.5px;margin-top:8px}
.kv dt{color:var(--muted);font-size:12.5px;padding-top:1px}
.kv dd{margin:0;white-space:pre-wrap;word-break:break-word;min-width:0}
.decide{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:8px}
#scr-worldcup .decide.wc-unlimited{grid-template-columns:repeat(2,minmax(0,1fr))}
.decide .btn{padding:10px 4px;font-size:13.5px}
.bar{height:5px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.roundhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.roundhead .big{font-family:var(--font-display);font-size:26px;line-height:1;color:var(--fg)}
.roundhead .big em{color:var(--accent);font-style:normal}

.rank{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0}
.rank .n{font-family:var(--font-display);font-size:22px;width:30px;color:var(--muted);line-height:1.1;flex:none;text-align:center}
.rank.top .n{color:var(--accent)}
.rank .th{width:104px;flex:none}
.rank .body{flex:1;min-width:0}
.rank .ttl{font-weight:500;font-size:14px;line-height:1.35}
.rank .sc{font-size:12.5px;color:var(--muted);margin-top:2px}
.rank .sc b{color:var(--fg);font-weight:500}

.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.sheet-in{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sheet-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;background:var(--bg);padding-block:6px;z-index:2}
.cm{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.cm .head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.cm .txt{margin-top:6px;white-space:pre-wrap;word-break:break-word;font-size:14px}
.cm .tk{margin-top:6px;display:grid;grid-template-columns:44px 1fr;gap:3px 8px;font-size:13.5px}
.cm .tk dt{color:var(--muted);font-size:12px}
.cm .tk dd{margin:0;white-space:pre-wrap;word-break:break-word}
.cm .foot{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.composer{background:var(--surface-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.composer textarea,.composer input{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;font-size:14px;min-width:0}
.composer textarea{display:block;min-height:56px;resize:none;overflow:hidden;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.composer [data-part="tackle"]{display:grid;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:13.5px;font-weight:500;z-index:30;max-width:90vw;text-align:center}
.gate{min-height:60vh;display:flex;align-items:center;justify-content:center;text-align:center}
.gate .card{max-width:420px}
.who{display:flex;align-items:center;gap:8px}
.who img{width:22px;height:22px;border-radius:50%}
table.plain{width:100%;border-collapse:collapse;font-size:13.5px}
table.plain td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.plain td:last-child{text-align:right;white-space:nowrap}
.empty{padding:28px 12px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.empty b{color:var(--fg);display:block;margin-bottom:4px;font-weight:500}

/* Desktop worldcup: use the available width without changing mobile or other tabs. */
@media (min-width:900px){
  main:has(> #scr-worldcup:not([hidden])){max-width:1440px;padding-left:24px;padding-right:24px}
  #scr-worldcup .match{grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr);gap:16px}
  #scr-worldcup .mcard{padding:16px}
}
.tc-description{white-space:pre-wrap;overflow-wrap:anywhere}.tc-links a{color:var(--accent-text);overflow-wrap:anywhere}.tc-candidate-title{margin:0}.tc-choice{min-height:48px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:18px;text-align:left;padding:20px}#scr-topics input,#scr-topics textarea{display:block;width:100%;margin-top:6px}#scr-topics li,#scr-topics h3{overflow-wrap:anywhere}

/* The one-line premise is the primary voting criterion; sources are optional context. */
#scr-topics .tc-candidate-title{font-size:clamp(24px,6vw,30px);font-weight:700;line-height:1.45;text-align:left;text-wrap:pretty;word-break:keep-all;overflow-wrap:anywhere;margin:0;padding:4px 0 8px;color:var(--fg)}
#scr-topics .tc-reference{margin:0;padding:10px 0 0;border-top:1px solid var(--line);text-align:left;font-size:13px;color:var(--muted);align-self:stretch;min-width:0}
#scr-topics .tc-reference summary{cursor:pointer;font-size:13px;font-weight:400;line-height:1.6;text-align:left;width:fit-content}
#scr-topics .tc-reference-body{display:flex;flex-direction:column;gap:8px;padding-top:10px;text-align:left;min-width:0}
#scr-topics .tc-links{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
#scr-topics .tc-links li{display:block;margin:0;padding:0;text-align:left}
#scr-topics .tc-links a{font-size:13px;line-height:1.6;text-align:left;text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere}
#scr-topics .tc-description{margin:0;font-size:13px;line-height:1.7;color:var(--muted);text-align:left}
#scr-topics .tc-choice{font-size:16px;padding:12px 16px;min-height:48px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2E2924"/><stop offset="1" stop-color="#090807"/></linearGradient></defs></svg>

<header class="top"><div class="top-in">
  <div class="brand">기획듀스 <b>101</b></div>
  <div class="week" id="weekBox"><span class="pill">연결 중</span></div>
</div></header>

<main>
  <section id="scr-gate" class="gate" hidden><div class="card stack"><h2 id="gateTitle">연결 중입니다</h2><p class="muted" id="gateMsg"></p></div></section>
  <section id="scr-board" hidden></section>
  <section id="scr-compose" hidden></section>
  <section id="scr-worldcup" hidden></section>
  <section id="scr-topics" hidden></section>
  <section id="scr-pk" hidden></section>
  <section id="scr-results" hidden></section>
  <section id="scr-admin" hidden></section>
</main>

<nav class="tabs" id="tabs" hidden><div class="tabs-in">
  <button class="tab on" data-tab="board"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 20V10"/></svg>게시판</button>
  <button class="tab" data-tab="compose"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>올리기</button>
  <button class="tab" data-tab="worldcup"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M6 3h12v6a6 6 0 0 1-12 0z"/><path d="M6 5H3v2a3 3 0 0 0 3 3M18 5h3v2a3 3 0 0 1-3 3"/></svg>월드컵</button>
  <button class="tab" data-tab="topics"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM8 9h8M8 14h8"/></svg>소재</button>

async function login() {

function ownerOf(settings) { return String((settings && settings.ownerEmail) || '').toLowerCase(); }

    m = { role: 'owner', name: S.name, addedAt: Date.now() };
    try { await S.db.doc('members/' + email).set(m); } catch (e) { gate('규칙 설정이 안 됐습니다', 'Firestore 규칙(firestore.rules)을 콘솔에 붙여넣고 게시했는지 확인하세요. ' + (e.code || '')); return; }

function subscribeAll() {

      if (input === active) focus = {key, field: input.dataset.f, start: input.selectionStart, end: input.selectionEnd, direction: input.selectionDirection};
    });
    forms.set(key, {fields, type: box.querySelector('[data-act="cmType"].on')?.dataset.v || 'develop'});
  });
  document.querySelectorAll('details').forEach(el => {
    const key = detailKey(el);
    if (!expanded.has(key)) expanded.set(key, []);
    expanded.get(key).push(el.open);
  });
  draw();
  const offsets = new Map();
  document.querySelectorAll('details').forEach(el => {
    const key = detailKey(el), index = offsets.get(key) || 0;
    offsets.set(key, index + 1);
    const states = expanded.get(key);
    if (states && index < states.length) el.open = states[index];
  });
  let focusTarget = null;
  document.querySelectorAll('[data-composer]').forEach(box => {
    const key = composerKey(box), saved = forms.get(key);
    if (!saved) return;
    box.querySelectorAll('[data-f]').forEach(input => {
      if (Object.prototype.hasOwnProperty.call(saved.fields, input.dataset.f)) input.value = saved.fields[input.dataset.f];
      if (focus && focus.key === key && focus.field === input.dataset.f) focusTarget = input;
    });
    if (box.querySelector('[data-act="cmType"]')) {
      box.querySelectorAll('[data-act="cmType"]').forEach(button => button.classList.toggle('on', button.dataset.v === saved.type));
      box.querySelectorAll('[data-part]').forEach(part => { part.hidden = part.dataset.part !== saved.type; });
    }
  });
  if (focusTarget) {
    focusTarget.focus({preventScroll: true});
    if (typeof focus.start === 'number') focusTarget.setSelectionRange(focus.start, focus.end, focus.direction || 'none');
  }
  if (sheet) sheet.scrollTop = sheetScroll;
  window.scrollTo(scrollX, scrollY);
}

/* board */
/* Actual submitted/published rounds, not unused calendar slots, define round numbers. */
function roundLabel(w) {
  const weeks = [...new Set(S.cards.map(c => c.weekId).concat(Object.keys(S.publicResults).filter(k => k.startsWith('w_')).map(k => k.slice(2)), [curWeek(), w]))].filter(Boolean).sort();
  const d = parseISO(w);
  return `${weeks.indexOf(w) + 1}회차(${d.getMonth() + 1}/${d.getDate()})`;
}
function publishedTopCard(c) {
  const r = S.publicResults['w_' + c.weekId];
  return !c.urgent && !!r && r.v === 2 && Array.isArray(r.cardIds) && r.cardIds.includes(c.id);
}
function topCardBadge(c) {
  return publishedTopCard(c) ? '<span class="pill good">상위 40%</span>' : '';
}

function tileHTML(c) {
  const cc = commentCount(c.id);
  const pills = [];
  if (publishedTopCard(c)) pills.push(topCardBadge(c));
  if (c.status === 'selected') pills.push('<span class="pill on">선정</span>');
  if (c.urgent) pills.push('<span class="pill bad">긴급</span>');
  if (isMine(c.id)) pills.push('<span class="pill acc">내 카드</span>');
  if (c.revisedFrom) pills.push('<span class="pill">수정본</span>');
  return `<button class="tile" data-act="open" data-id="${esc(c.id)}">${thumbSVG(c.t1, c.t2)}<div class="tile-title">${esc(c.title)}</div><div class="tile-meta"><span>피지컬갤러리 · 연습생 ${esc(c.no || '')}</span>${cc ? `<span>· 코멘트 ${cc}</span>` : ''}${pills.join('')}</div></button>`;
}
function renderBoard() {
  const w = curWeek(), cur = S.cards.filter(c => c.weekId === w);
  const next = S.cards.filter(c => c.weekId > w);
  const pool = cur.filter(c => !c.urgent), urgent = cur.filter(c => c.urgent);
  const cap = S.settings.target || 16;
  const mineN = countMine(w);
  let html = `<div class="stack">
    <div class="between"><h2>${esc(roundLabel(w))} 월드컵 카드 <span class="muted num" style="font-weight:400">${pool.length}/${cap}</span></h2><span class="pill ${mineN >= myLimit() ? 'good' : ''}">내 카드 ${mineN}/${myLimit()}</span></div>
    <p class="small muted">${forcedRound() ? `회차·단계 고정 중 · ${esc(weekLabel(w))} · ${PHASE[phase()]} · 운영자가 ‘자동으로’를 누를 때까지 유지됩니다.` : esc(S.settings.schedule || '')}</p>`;
  if (S.canWrite === false) html += `<div class="note">보기 전용 권한입니다. 카드를 올리거나 월드컵을 하려면 계란님에게 '편집자' 권한으로 다시 초대해 달라고 하세요.</div>`;
  if (urgent.length) html += `<h3 style="margin-top:4px">긴급 카드 <span class="muted small" style="font-weight:400">월드컵 없이 바로 회의 안건</span></h3><div class="feed">${urgent.map(tileHTML).join('')}</div>`;
  html += pool.length
    ? `<div class="feed">${pool.map(tileHTML).join('')}</div>`
    : `<div class="empty"><b>아직 올라온 카드가 없습니다</b>'올리기' 탭에서 첫 카드를 올려보세요. 작성자는 보이지 않습니다.</div>`;
  if (next.length) html += `<h3 style="margin-top:8px">다음 회차 대기 <span class="muted small" style="font-weight:400">${next.length}장 · ${esc(weekLabel(next[0].weekId))}</span></h3><div class="feed">${next.map(tileHTML).join('')}</div>`;
  const past = S.cards.filter(c => c.weekId < w);
  const archiveWeeks = [...new Set(past.map(c => c.weekId))].sort().reverse();
  const oldArchive = [...document.querySelectorAll('[data-archive-week]')];
  const opened = new Set(oldArchive.filter(el => el.open).map(el => el.dataset.archiveWeek));
  if (past.length) {
    html += `<h2 style="margin-top:16px">회차별 카드 아카이브 <span class="muted small" style="font-weight:400">${archiveWeeks.length}회 · 총 ${past.length}장</span></h2><p class="small muted">지난 회차의 모든 카드를 보관합니다. 상위 40% 배지는 공개된 월드컵 결과 기준이며, ‘선정’과는 별개입니다.</p>`;
    html += archiveWeeks.map((week, i) => {
      const cards = past.filter(c => c.weekId === week);
      const result = S.publicResults['w_' + week];
      const published = result && result.v === 2 && Array.isArray(result.cardIds);
      const topN = cards.filter(publishedTopCard).length;
      const note = published ? `상위 40% ${topN}장` : '결과 발표 전';
      const open = oldArchive.length ? opened.has(week) : i === 0;
      return `<details class="more" data-archive-week="${esc(week)}" ${open ? 'open' : ''}><summary>${esc(roundLabel(week))} · ${cards.length}장 · ${note}</summary><div class="feed" style="margin-top:10px">${cards.map(tileHTML).join('')}</div></details>`;
    }).join('');
  }
  html += `</div>`;
  $('#scr-board').innerHTML = html;
}

/* worldcup */
function makePairs(ids) {

    run.round++; startRound(run, run.next, dual);

  const pair = run.pairs[run.idx]; if (!pair) return false;
  const pass = id => { run.next.push(id); run.points[id] = (run.points[id] || 0) + roundPts(run.round); };
  if (choice === 'top' || choice === 'both') pass(pair[0]);
  if (choice === 'bottom' || choice === 'both') pass(pair[1]);

  if (run.idx < run.pairs.length) return false;
  if (run.next.length <= 1 || run.next.length === run.remaining.length) {

  run.round++; startRound(run, run.next, run.audit.dual); return false;
}

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const draw = (w, h, q) => { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; cv.getContext('2d').drawImage(img, 0, 0, w, h); return cv.toDataURL('image/jpeg', q); };
      let r = Math.min(1, 800 / img.width), w = Math.round(img.width * r), h = Math.round(img.height * r), q = 0.82, out = draw(w, h, q);
      while (out.length > 180000 && q > 0.45) { q -= 0.1; out = draw(w, h, q); }
      while (out.length > 180000 && w > 320) { w = Math.round(w * 0.75); h = Math.round(h * 0.75); out = draw(w, h, 0.7); }
      resolve(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('이미지를 읽지 못했습니다')); };
    img.src = url;
  });
}

      await S.db.doc('cards/' + id).update({ status: 'selected', authorUid: author, selectedAt: Date.now() });
      toast(author ? '선정했습니다. 작성자가 공개됩니다' : '선정했습니다. 작성자는 본인이 앱을 열면 표시됩니다');
    } else { await S.db.doc('cards/' + id).update({ status: 'active', authorUid: null }); toast('선정을 취소했습니다'); }
  } catch (e) { toast('실패: ' + (e.code || e.message)); }
  S.busy = false;
}

/* Admin-only reads: completion identities are never linked to individual preferences. */
let adminTopicGeneration = 0;
let adminTopicRevoked = false;
const adminTopicBusy = new Set();
function clearAdminTopicParticipants(revoke = false) {
  adminTopicGeneration++;
  if (revoke) adminTopicRevoked = true;
  const box = $('#adminTopicParticipants');
  if (box) box.replaceChildren();
}
function adminTopicRanking(c, result) {
  if (!result.n) return '<p>유효 완료 투표가 없어 순위를 매기지 않습니다.</p>';
  return '<p class="small muted">승률 내림차순'+(c.v===2?', 같으면 우승 횟수 내림차순. 두 값 모두 같으면 공동 순위입니다.':' · 기존 v1 비교이며 우승 횟수는 산출하지 않습니다.')+' 10위 경계 동률은 모두 표시합니다. 같은 순위 내 ID순은 표시용입니다. 부전승은 승률에 포함하지 않습니다.</p><ol class="stack" style="list-style:none;padding:0">'+TopicCore.rank(c,result).filter(x=>x.rank<=10).map(x=>'<li class="card"><b>'+(x.tied?'공동 ':'')+x.rank+'위</b>'+tcCandidate(c,x.id)+'<span>'+x.wins+'승 '+(x.appearances-x.wins)+'패 / '+x.appearances+'경기 · 승률 '+(x.appearances?100*x.wins/x.appearances:0).toFixed(1)+'% · 우승 '+(c.v===2?x.championships+'회':'집계 없음 (v1)')+'</span></li>').join('')+'</ol>';
}
async function renderAdminTopicParticipants(box) {
  if (!isOps() || adminTopicRevoked || !S.uid || S.auth?.currentUser?.uid !== S.uid || S.tab !== 'admin' || !box?.isConnected || $('#adminTopicParticipants') !== box) return;
  const expanded = new Set([...box.querySelectorAll('details[data-topic-ranking][open]')].map(el=>el.dataset.topicRanking));
  const generation = ++adminTopicGeneration, uid = S.uid;
  const current = () => isOps() && !adminTopicRevoked && S.uid === uid && S.auth?.currentUser?.uid === uid && S.tab === 'admin' && box.isConnected && $('#adminTopicParticipants') === box && generation === adminTopicGeneration;
  box.innerHTML = '<div class="between"><h3>소재 월드컵 운영 · 중간 집계 / 결과 발표</h3><button type="button" class="btn sm" data-topic-participants-refresh>새로고침</button></div><p class="small muted">계란님·운영자 전용 · 완료 인원 확인 → 중간 TOP10 확인 → 수동 마감 → 결과 발표. 최종 제출을 검증한 완료자만 집계합니다. 개인별 선택·우승 소재는 이름과 연결해 표시하지 않습니다. 중간 집계는 잠정치이며 발표 전에는 일반 참여자에게 공개하거나 회차 문서에 저장하지 않습니다.</p><div data-topic-participants-list role="status">불러오는 중...</div>';
  const refresh = box.querySelector('[data-topic-participants-refresh]');
  refresh.disabled = adminTopicBusy.size > 0;
  refresh.onclick = () => { if (current() && !adminTopicBusy.size) void renderAdminTopicParticipants(box); };
  const list = box.querySelector('[data-topic-participants-list]');
  const errorText = e => esc(e?.code || e?.message || '읽기 또는 검증 오류');
  try {
    if (!current()) return;
    const q = await S.db.collection('topicContests').get({ source: 'server' });
    if (!current()) return;
    const time = t => typeof t?.toMillis === 'function' ? t.toMillis() : typeof t === 'number' ? t : (t?.seconds || 0) * 1000 + (t?.nanoseconds || 0) / 1000000;
    const contests = q.docs.map(d => ({ ...d.data(), id: d.id })).filter(topicContestVisible).sort((a, b) => time(b.createdAt) - time(a.createdAt) || a.id.localeCompare(b.id));
    if (!contests.length) { list.innerHTML = '<p class="small muted">아직 소재 월드컵 회차가 없습니다.</p>'; return; }
    list.innerHTML = contests.map(c => '<section class="card stack"><h4>' + esc(c.title || '제목 없음') + '</h4><p class="small muted">v' + esc(c.v) + ' · ' + esc({draft:'초안',open:'투표 중',closed:'마감 · 결과 비공개',published:'이미 결과 발표됨'}[c.state] || c.state || '상태 미상') + '</p><div data-topic-completion role="status">완료자 불러오는 중...</div><div data-topic-operations></div></section>').join('');
    const slots = [...list.querySelectorAll('[data-topic-completion]')], controls = [...list.querySelectorAll('[data-topic-operations]')];
    await Promise.all(contests.map(async (c, i) => {
      try {
        if (!current()) return;
        if (!TopicCore.validContest(c)) throw { code: 'invalid-contest' };
        const votes = await S.db.collection('topicContests').doc(c.id).collection('votes').get({ source: 'server' });
        if (!current()) return;
        const ballots = votes.docs.map(d=>({uid:d.id,data:d.data()}));
        const ids = ballots.filter(b => TopicCore.verify(c, b.uid, b.data)).map(b => b.uid).sort();
        const result = TopicCore.aggregate(c, ballots);
        slots[i].innerHTML = '<p>유효 완료 ' + ids.length + '명 · 검증에서 제외된 제출 '+result.rejected+'건</p>' + (ids.length ? '<ul>' + ids.map(id => '<li data-name="' + esc(id) + '">이름 확인 중 (프로필 미등록 시 표시 불가)</li>').join('') + '</ul>' : '<p class="small muted">아직 유효한 최종 제출자가 없습니다.</p>');
        if(c.state!=='draft') slots[i].innerHTML += '<details data-topic-ranking="'+esc(c.id)+'" '+(expanded.has(c.id)?'open':'')+'><summary>'+(c.state==='published'?'발표된 TOP10 확인':'중간 TOP10 확인 (운영자 전용)')+'</summary><p class="note">'+(c.state==='published'?'이미 발표된 저장 결과입니다. 재발표하지 않습니다.':'운영자 전용 잠정 집계 · 추가 제출에 따라 순위가 달라질 수 있으며, 결과 발표 시 서버에서 다시 집계합니다.')+'</p>'+(c.state==='published'?(c.result?'<p>발표 기준 유효 완료 '+esc(c.result.n)+'명 · 제외 '+esc(c.result.rejected)+'건</p>'+adminTopicRanking(c,c.result):'<p>저장된 발표 결과가 없습니다.</p>'):adminTopicRanking(c,result))+'</details>';
        if (current()) profilesInto();
        const control = controls[i], key = uid+'/'+c.id;
        let pending = null;
        const drawControls = (error='') => {
          if(!current()) return;
          const busy = adminTopicBusy.has(key), disabled=busy?'disabled':'';
          control.innerHTML = (c.state==='open'?'<p class="small muted">수동 마감하면 새 최종 제출을 받지 않습니다. 마감만으로 결과가 공개되지는 않습니다.</p><button type="button" class="btn" data-topic-op="close" '+disabled+'>수동 마감</button> <button type="button" class="btn" disabled>결과 발표</button><p class="small muted">결과 발표는 수동 마감 후 별도로 진행하세요.</p>':c.state==='closed'?'<p class="small muted">마감된 회차입니다. 결과 발표를 누르면 검증된 최종 제출을 새로 집계해 모든 참여자에게 공개합니다.</p><button type="button" class="btn" data-topic-op="publish" '+disabled+'>결과 발표</button>':c.state==='draft'?'<p class="small muted">초안입니다. 소재 탭에서 회차를 시작하세요.</p>':'<p class="small muted">이미 결과 발표됨 · 재발표할 수 없습니다.</p>')+(pending?'<div class="note"><p>'+(pending==='close'?'이 회차를 수동 마감하고 새 최종 제출을 중단할까요? 결과는 아직 공개되지 않습니다.':'이 회차의 최종 결과를 모든 참여자에게 발표할까요?')+'</p><button type="button" class="btn" data-topic-confirm '+disabled+'>'+(busy?'처리 중...':pending==='close'?'수동 마감 확인':'결과 발표 확인')+'</button> <button type="button" class="btn" data-topic-cancel '+disabled+'>취소</button></div>':'')+(error?'<p role="alert">'+errorText(error)+' · 새로고침하거나 다시 시도하세요.</p>':'');
          control.querySelectorAll('[data-topic-op]').forEach(b=>b.onclick=()=>{if(!current()||adminTopicBusy.has(key))return;pending=b.dataset.topicOp;drawControls();});
          const cancel=control.querySelector('[data-topic-cancel]');
          if(cancel)cancel.onclick=()=>{if(!current()||adminTopicBusy.has(key))return;pending=null;drawControls();};
          const confirm=control.querySelector('[data-topic-confirm]');
          if(confirm)confirm.onclick=async()=>{
            if(!current()||adminTopicBusy.has(key)||!['close','publish'].includes(pending))return;
            const action=pending, ref=tcRef(c.id);
            let reloaded=false;
            adminTopicBusy.add(key);refresh.disabled=true;drawControls();
            const assertCurrent=()=>{if(!current())throw Error('운영 권한 또는 화면이 변경되었습니다.');};
            try{
              assertCurrent();
              let result;
              if(action==='publish'){
                const fresh=await ref.get({source:'server'});assertCurrent();
                const contest={...fresh.data(),id:c.id};
                if(!fresh.exists||contest.state!=='closed'||!topicContestVisible(contest)||!TopicCore.validContest(contest))throw Error('먼저 수동 마감하세요. 상태가 변경되었다면 새로고침하세요.');
                const q=await ref.collection('votes').get({source:'server'});assertCurrent();
                result=TopicCore.aggregate(contest,q.docs.map(d=>({uid:d.id,data:d.data()})));
              }
              assertCurrent();
              await S.db.runTransaction(async tx=>{
                assertCurrent();
                const d=await tx.get(ref);assertCurrent();
                const fresh={...d.data(),id:c.id};
                if(!d.exists||fresh.state!==(action==='close'?'open':'closed')||!topicContestVisible(fresh)||!TopicCore.validContest(fresh))throw Error('회차 상태가 변경되었습니다. 새로고침하세요.');
                tx.update(ref,action==='close'?{state:'closed',updatedAt:tcStamp()}:{state:'published',result,updatedAt:tcStamp()});
              });
              // Tab entry already fetches server data; avoid disrupting a ballot/save or in-flight load.
              if(TC.uid===uid&&!TC.busy&&!TC.loading&&!TC.saving)TC.items=null;
              pending=null;adminTopicBusy.delete(key);
              if(current()){reloaded=true;await renderAdminTopicParticipants(box);}
            }catch(e){pending=null;drawControls(e);}
            finally{adminTopicBusy.delete(key);if(current()){refresh.disabled=adminTopicBusy.size>0;control.querySelectorAll('button[data-topic-op]').forEach(b=>b.disabled=false);}else if(!reloaded&&S.uid===uid&&box.isConnected&&$('#adminTopicParticipants')===box){void renderAdminTopicParticipants(box);}}
          };
        };
        drawControls();
      } catch (e) {
        if (current()) slots[i].innerHTML = '<p role="alert">완료자·집계 확인 실패: ' + errorText(e) + '. 위 새로고침으로 다시 시도하세요.</p>';
      }
    }));
  } catch (e) {
    if (current()) list.innerHTML = '<p role="alert">회차 목록 읽기 실패: ' + errorText(e) + '. 새로고침으로 다시 시도하세요.</p>';
  }
}

// Recompute scores from pairings and choices. A forged points map is ignored.
// This is an internal-team integrity check, not server attestation of UI activity.
function verifiedVote(v, eligible, allowUnlimited = false) {
  if (!v?.audit || !Object.prototype.hasOwnProperty.call(v.audit, 'mode')) return verifiedLegacyVote(v, eligible);
  if (!allowUnlimited || v.audit.mode !== 'unlimited-v1') return null;
  try {
    const a = v.audit, seen = v.seen;
    if (!Array.isArray(seen) || seen.length < 2 || seen.length > 200 || new Set(seen).size !== seen.length || seen.some(id => typeof id !== 'string' || !eligible.includes(id))) return null;
    if (a.v !== 1 || !Number.isInteger(a.dual) || a.dual < 0 || a.dual > 100 || !Array.isArray(a.rounds) || !Array.isArray(a.choices) || a.rounds.length < 1 || a.rounds.length > seen.length - 1) return null;
    let remaining = seen.slice(), at = 0, terminated = false;
    const points = Object.create(null);
    for (let r = 0; r < a.rounds.length; r++) {
      if (terminated || remaining.length < 2) return null;
      const pairs = a.rounds[r]?.pairs;
      if (!Array.isArray(pairs) || pairs.length !== Math.ceil(remaining.length / 2)) return null;
      const flat = [], next = [];
      let byes = 0;
      for (const p of pairs) {
        if (!p || Array.isArray(p) || (p.length !== 1 && p.length !== 2) || Object.keys(p).sort().join(',') !== (p.length === 1 ? '0,length' : '0,1,length')) return null;
        if (p.length === 1) byes++;
        for (let i = 0; i < p.length; i++) flat.push(p[i]);
      }
      if (byes !== remaining.length % 2 || flat.length !== remaining.length || new Set(flat).size !== flat.length || flat.some(id => !remaining.includes(id))) return null;
      const pass = id => { next.push(id); points[id] = (points[id] || 0) + Math.min(r + 1, 5); };
      pairs.filter(p => p.length === 1).forEach(p => pass(p[0]));
      for (const p of pairs.filter(p => p.length === 2)) {
        const choice = a.choices[at++];
        if (!['top','bottom','both','neither'].includes(choice)) return null;
        if (choice === 'top' || choice === 'both') pass(p[0]);
        if (choice === 'bottom' || choice === 'both') pass(p[1]);
      }
      terminated = next.length <= 1 || next.length === remaining.length;
      remaining = next;
    }
    if (!terminated || at !== a.choices.length || Object.values(points).some(p => p > 5 * (seen.length - 1))) return null;
    return {seen, points, winners:remaining};
  } catch(e) { return null; }
}
function verifiedLegacyVote(v, eligible) {
  try {
    if(!v || !Array.isArray(v.seen) || v.seen.length<2 || v.seen.length>200) return null;
    const set=new Set(v.seen); if(set.size!==v.seen.length || v.seen.some(id=>typeof id!=='string'||!eligible.includes(id)))return null;
    if(!v.audit) { // Preserve already-stored legacy results; new writes require audit v1.
      const pts=v.points||{}, cap=5*(v.seen.length-1);
      if(Object.keys(pts).some(id=>!set.has(id)||!Number.isInteger(pts[id])||pts[id]<0||pts[id]>cap))return null;
      return {seen:v.seen,points:pts,legacy:true};
    }
    const a=v.audit;
    if(a.v!==1 || !Number.isInteger(a.dual) || a.dual<0 || a.dual>100 || !Array.isArray(a.rounds)||!Array.isArray(a.choices))return null;
    let remaining=v.seen.slice(), at=0, round=0, points={};
    for(const storedRound of a.rounds) {
      const rawPairs = Array.isArray(storedRound) ? storedRound : storedRound?.pairs;
      if (!Array.isArray(rawPairs)) return null;
      const pairs = rawPairs.map(p => {
        if (Array.isArray(p)) return p;
        if (!p || (p.length !== 1 && p.length !== 2)) return null;
        return p.length === 1 ? [p[0]] : [p[0], p[1]];
      });
      round++; if(remaining.length<=1 || round>200 || !Array.isArray(pairs)||pairs.length!==Math.ceil(remaining.length/2))return null;
      if(pairs.some(p=>!Array.isArray(p)||(p.length!==1&&p.length!==2)))return null;
      const flat=pairs.flat(); if(flat.length!==remaining.length||new Set(flat).size!==flat.length||flat.some(id=>!remaining.includes(id)))return null;
      if(pairs.filter(p=>p.length===1).length!==remaining.length%2)return null;
      let dual=remaining.length>4 ? Math.max(0,Math.min(a.dual,Math.floor(remaining.length/2)-1)) : 0;
      const next=[],pass=id=>{next.push(id);points[id]=(points[id]||0)+Math.min(round,5);};
      pairs.filter(p=>p.length===1).forEach(p=>pass(p[0]));
      for(const p of pairs.filter(p=>p.length===2)) {
        const ch=a.choices[at++];
        if(ch==='top')pass(p[0]); else if(ch==='bottom')pass(p[1]); else if(ch==='both'&&dual>0){pass(p[0]);pass(p[1]);dual--;} else return null;
      }
      remaining=next;
    }
    if(remaining.length!==1||at!==a.choices.length)return null;
    return {seen:v.seen,points};
  } catch(e) {return null;}
}

/* TOPIC_CORE_START: deterministic, browser-independent ballot verifier. */
const TopicCore = (() => {
  function rng(seed) { let h=2166136261; for(const ch of seed) h=Math.imul(h^ch.charCodeAt(0),16777619); return ()=>{h+=0x6D2B79F5;let t=h;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296;}; }

if(c.state==='open'&&!TC.loadError&&TC.ballot&&!TC.done){const state=c.v===2?TopicCore.replay(c,S.uid,TC.ballot):null,pair=TopicCore.next(c,S.uid,TC.ballot),i=TC.ballot.choices.length,total=c.ids.length-(c.v===2?1:0);body+='<p role="status">'+(state?.next?state.next.roundLabel+' · 라운드 실제 경기 '+state.next.roundMatch+' / '+state.next.roundMatches+' · ':'')+'전체 참가 소재 '+c.ids.length+'개 · 실제 선택 '+i+' / '+total+' · '+(TC.dirty?'미저장 변경 있음':'저장된 진행')+'</p><progress max="'+total+'" value="'+i+'" style="width:100%"></progress>';if(pair)body+='<div class="stack">'+pair.map(id=>'<article class="card stack">'+tcCandidate(c,id)+'<button class="btn tc-choice" data-tc="choose" data-choice="'+esc(id)+'" data-index="'+i+'" '+(TC.busy||TC.saving?'disabled':'')+'>이 소재 선택</button></article>').join('')+'</div>';if(state?.complete)body+='<div class="card stack"><b>내 토너먼트 우승 · 최종 제출 전</b>'+tcCandidate(c,state.champion)+'</div>';body+='<div class="row">'+tcButton('save',TC.saving?'저장 중...':'진행 저장')+(i===total?tcButton('submit','최종 제출'):'')+'</div><p class="small muted">선택마다 자동 저장합니다. 저장 실패 시 이 화면을 유지하고 재시도하세요. 여러 기기에서 동시에 투표하지 마세요. 최종 제출 전까지 집계되지 않습니다.</p>';}
if(c.state==='closed')body+='<p class="note">마감되었습니다. 미완료 기록은 집계되지 않습니다. 공개를 기다려주세요.</p>';
if(c.state==='published'&&c.result){const r=c.result;body+='<h3>'+(c.v===2?'TOP 10':'기존 v1 결과')+'</h3><p>유효 완료 '+r.n+'명 · 제외 '+r.rejected+'건</p><p class="small muted">'+(c.v===2?'승률 내림차순, 같으면 우승 횟수 내림차순. 두 값 모두 같으면 공동 순위입니다. 10위 경계 동률은 모두 표시하므로 10개를 넘을 수 있습니다.':'기존 비탈락 비교의 승률 순위입니다. 토너먼트 우승은 이 기록에서 산출할 수 없습니다. 우승 횟수 없음.')+' 같은 순위 내 소재 ID순은 표시용이며 우열이 아닙니다.</p>';if(!r.n)body+='<p>유효 완료 투표가 없어 순위를 매기지 않습니다.</p>';else body+='<ol class="stack" style="list-style:none;padding:0">'+TopicCore.rank(c,r).filter(x=>c.v===1||x.rank<=10).map(x=>'<li class="card"><b>'+(x.tied?'공동 ':'')+x.rank+'위</b>'+tcCandidate(c,x.id)+'<span>'+x.wins+'승 '+(x.appearances-x.wins)+'패 / '+x.appearances+'경기 · 승률 '+(x.appearances?100*x.wins/x.appearances:0).toFixed(1)+'%'+(c.v===2?' · 우승 '+x.championships+'회':'')+'</span></li>').join('')+'</ol>';}
}}el.innerHTML=head+body+tcCreateForm()+'</div>';const panel=$('#tcCreatePanel');if(panel)panel.addEventListener('toggle',()=>{if(panel.isConnected)TC.formOpen=panel.open;});}
async function tcSave(){if(TC.saving||!TC.ballot||TC.done)return;TC.saving=true;const id=TC.open,copy={v:TC.ballot.v,choices:TC.ballot.choices.slice(),updatedAt:tcStamp()};try{const c=TC.items.find(x=>x.id===id);if(!TopicCore.verify(c,S.uid,copy,true))throw Error('진행 기록 검증 실패');await tcProgress(id).set(copy);TC.dirty=false;TC.error='';}catch(e){TC.dirty=true;TC.error='진행 저장 실패. 화면을 유지하고 저장을 재시도하세요: '+(e.code||e.message);}finally{TC.saving=false;if(S.tab==='topics')renderTopics();}}
async function tcAction(action,t){if(TC.busy||TC.saving)return;
if(action==='modePlain'||action==='modeJson'){const mode=action==='modeJson'?'json':'plain';if(mode===TC.form.mode)return;try{if(TC.form.text.trim()){const entries=TopicDetails.parse(TC.form.text,TC.form.mode);if(mode==='plain'&&(TC.editId||entries.some(x=>x.description||x.links.length)))throw Error('설명·출처·후보 ID 보존을 위해 이 초안은 JSON으로 수정하세요.');TC.form.text=mode==='json'?JSON.stringify(entries,null,2):entries.map(x=>x.title).join('\n');}TC.form.mode=mode;TC.error='';}catch(e){TC.error=e.message;}renderTopics();return;}
if(['copy','edit','create'].includes(action)&&TC.dirty){TC.error='먼저 진행 저장을 재시도하세요.';renderTopics();return;}if(action==='copy'&&isOps()){const d=TC.items.find(x=>x.id===t.dataset.id);if(!d||d.v!==1||!['closed','published'].includes(d.state))return;++TC.entry;TC.pendingEntry=0;TC.formOpen=true;const panel=$('#tcCreatePanel');if(panel)panel.open=true;TC.editId=null;TC.form={title:(d.title+' · 토너먼트').slice(0,120),text:JSON.stringify(TopicDetails.entries(d).map(({id,...entry})=>entry),null,2),mode:'json'};TC.open=null;TC.error='기존 회차와 투표는 보존됩니다. 새 v2 초안을 저장하세요.';renderTopics();return;}if(action==='edit'&&isOps()){const d=TC.items.find(x=>x.id===t.dataset.id);if(!d||d.state!=='draft')return;++TC.entry;TC.pendingEntry=0;TC.formOpen=true;const panel=$('#tcCreatePanel');if(panel)panel.open=true;TC.editId=d.id;TC.form={title:d.title,text:JSON.stringify(TopicDetails.entries(d),null,2),mode:'json'};TC.open=null;renderTopics();return;}if(action==='refresh'){tcLoad();return;}if(action==='open'||action==='reload'){++TC.entry;TC.pendingEntry=0;tcOpen(t.dataset.id);return;}if(action==='back'){if(TC.dirty){TC.error='먼저 진행 저장을 재시도하세요.';renderTopics();return;}++TC.entry;TC.pendingEntry=0;TC.open=null;TC.error='';renderTopics();return;}if(action==='save'){tcSave();return;}
const c=TC.items?.find(x=>x.id===TC.open);
if(action==='choose'){const i=TC.ballot?.choices.length;if(TC.done||!c||c.state!=='open'||Number(t.dataset.index)!==i||Date.now()<TC.choiceLock)return;const pair=TopicCore.next(c,S.uid,TC.ballot);if(!pair?.includes(t.dataset.choice))return;TC.choiceLock=Date.now()+450;TC.ballot.choices.push(t.dataset.choice);TC.dirty=true;tcSave();return;}
TC.busy=true;TC.error='';renderTopics();try{
if(action==='create'){++TC.entry;TC.pendingEntry=0;if(!isOps())throw Error('운영자 전용');const title=TC.form.title.trim();if(!title||title.length>120)throw Error('회차 제목은 1~120자입니다.');const entries=TopicDetails.parse(TC.form.text,TC.form.mode),old=TC.items.find(x=>x.id===TC.editId),packed=TopicDetails.pack(entries,old);const ref=TC.editId?tcRef(TC.editId):S.db.collection('topicContests').doc();const payload={v:old?.v||2,title,...packed,seed:old?.seed||ref.id,state:'draft',createdAt:tcStamp(),updatedAt:tcStamp()};if(TC.editId){await S.db.runTransaction(async tx=>{const d=await tx.get(ref);if(d.data().state!=='draft')throw Error('이미 시작되어 수정할 수 없습니다.');tx.update(ref,{title,...packed,updatedAt:tcStamp()});});}else await ref.set(payload);TC.items=TC.items.filter(x=>x.id!==ref.id);TC.items.unshift({...payload,id:ref.id,createdAt:old?.createdAt||{seconds:Date.now()/1000}});TC.editId=null;TC.form={title:'',text:'',mode:'plain'};TC.open=ref.id;TC.loadError=false;TC.ballot=null;TC.done=false;await tcLoad();}
if(action==='start'||action==='close'){if(!isOps())throw Error('운영자 전용');await S.db.runTransaction(async tx=>{const ref=tcRef(c.id),d=await tx.get(ref),fresh={...d.data(),id:c.id};if(fresh.state!==(action==='start'?'draft':'open')||!TopicCore.validContest(fresh))throw Error('상태가 변경되었습니다. 다시 읽어주세요.');tx.update(ref,{state:action==='start'?'open':'closed',updatedAt:tcStamp()});});await tcLoad();if(action==='start'){TC.busy=false;await tcOpen(c.id);}}
if(action==='submit'){if(!TopicCore.verify(c,S.uid,TC.ballot))throw Error('모든 비교를 완료해야 합니다.');const ballot={v:c.v,choices:TC.ballot.choices.slice(),completedAt:tcStamp()};await S.db.runTransaction(async tx=>{const ref=tcRef(c.id),vote=ref.collection('votes').doc(S.uid),existing=await tx.get(vote),fresh=await tx.get(ref);if(existing.exists){TC.ballot=existing.data();return;}if(fresh.data().state!=='open')throw Error('이미 마감되었습니다. 제출할 수 없습니다.');tx.set(vote,ballot);});TC.done=true;TC.dirty=false;}
if(action==='publish'){if(!isOps())throw Error('운영자 전용');const fresh=await tcRef(c.id).get({source:'server'}),contest={...fresh.data(),id:c.id};if(contest.state!=='closed')throw Error('먼저 수동 마감하세요.');const q=await tcRef(c.id).collection('votes').get({source:'server'}),result=TopicCore.aggregate(contest,q.docs.map(d=>({uid:d.id,data:d.data()})));await S.db.runTransaction(async tx=>{const ref=tcRef(c.id),d=await tx.get(ref);if(d.data().state!=='closed')throw Error('상태가 변경되었습니다.');tx.update(ref,{state:'published',result,updatedAt:tcStamp()});});await tcLoad();}
}catch(e){TC.error='실패: '+(e.code||e.message)+' · 다시 시도할 수 있습니다.';}finally{TC.busy=false;renderTopics();tcResumeEntry();}}
document.addEventListener('input',e=>{if(e.target.id==='tcTitle')TC.form.title=e.target.value;if(e.target.id==='tcText')TC.form.text=e.target.value;});
document.addEventListener('click',e=>{const t=e.target.closest('[data-tc]');if(t)tcAction(t.dataset.tc,t);});
window.addEventListener('beforeunload',e=>{if(TC.dirty||TC.saving){e.preventDefault();e.returnValue='';}});

init();
})();
</script>
